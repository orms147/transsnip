[project]
name = "transsnip"
version = "0.3.0"
description = "Screen translation app for Windows — hotkey-driven OCR + multi-provider translation with context-aware results"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "orms147", email = "orms147@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    # GUI
    "PySide6>=6.7.0",
    # Screen capture
    "mss>=9.0.1",
    "Pillow>=10.2.0",
    # Frame-diff gate of the video-subtitle loop (utils/image.py), imported at
    # startup — not just by the OCR extra.
    "numpy>=1.24",
    # System tray: Qt's QSystemTrayIcon (no extra dependency).
    # Global hotkeys: Win32 RegisterHotKey via ctypes (no external dependency).
    # The old `keyboard` lib was dropped — its WH_KEYBOARD_LL hook got silently
    # removed by Windows under load and never re-attached (dead hotkeys at boot).
    # Config & API key storage
    "pydantic>=2.6.0",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
ocr = [
    # Windows.Media.Ocr via the modular pywinrt projection (the monolithic
    # `winsdk` beta it replaces was ~70 MB and unmaintained).
    "winrt-runtime>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2.1,<4; sys_platform == 'win32'",
    # RapidOCR 3.x: PaddleOCR PP-OCRv5 models served via ONNX Runtime. One `ch`
    # model spans Chinese + Japanese + English (the old v4 bundle dropped
    # Japanese kana); Korean / Latin get their own small models. Models ship in
    # `resources/models/` — run `python scripts/fetch_models.py` once after a
    # fresh clone (they're gitignored to keep the repo lean). ~12x smaller than
    # full PaddleOCR, no PaddlePaddle framework. See `transsnip/ocr/models.py`.
    "rapidocr>=3.0",
    "onnxruntime>=1.17.0",
    # Splits run-on English titles back into words (OCR post-process).
    # See transsnip/ocr/segment.py.
    "wordninja>=2.0.0",
]
translate = [
    # LLM-based providers (context-aware, paid)
    "anthropic>=0.109.0",  # output_config (effort) on Haiku 5.5
    "google-generativeai>=0.8.0",
    "openai>=1.20.0",
    # Translation-only providers
    "deep-translator>=1.11.0",  # wraps Google Translate / Linguee / Pons — no API key needed
]
tts = [
    "edge-tts>=6.1.10",
    # Offline SAPI fallback (tts/sapi.py).
    "winrt-Windows.Media.SpeechSynthesis>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
]
learning = [
    "eng-to-ipa>=0.0.2",
]
audio = [
    # Audio-subtitle mode (Alt+A): translate the spoken audio of a video that has
    # no on-screen text. WASAPI loopback capture + faster-whisper ASR, all local.
    # The Whisper model (~460MB for `small`) is fetched on first use, NOT bundled.
    # Optional + source-install only — NOT in the default .exe (ctranslate2+MKL is
    # heavy; see TransSnip.spec excludes). See transsnip/asr/whisper.py + docs.
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",  # WASAPI loopback capture
    "faster-whisper>=1.0",                              # multilingual REQUIRED (Vietnamese)
    "numpy>=1.24",
    "scipy>=1.11",                                      # 48k→16k resample
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
transsnip = "transsnip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transsnip"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "BLE", "SIM", "RUF"]
# RUF001-003 flag "ambiguous" Unicode (–, ’, Vietnamese letters) — the UI and
# comments are bilingual on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Qt event-handler overrides must keep Qt's camelCase names.
"transsnip/**/*.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
